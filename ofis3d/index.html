<!DOCTYPE html>

<head>

<style>

.etiket.err b{background:#d23c3c}.etiket.wait b{background:#c9861a}
.gom .etiket span{display:none}.gom .etiket b{font-size:9px;padding:1px 6px;opacity:.9}

<script type="module">
import * as THREE from './lib/three.module.js';
import { OrbitControls } from './lib/OrbitControls.js';
import { mergeGeometries } from './lib/BufferGeometryUtils.js';
import { GLTFLoader } from './lib/GLTFLoader.js';

/* ================= temel ================= */
const GOM = new URLSearchParams(location.search).has('gom');
if (GOM) document.documentElement.classList.add('gom');
const kap = document.getElementById('sahne');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, GOM ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
kap.append(renderer.domElement);
const sahne = new THREE.Scene(); sahne.background = new THREE.Color('#d7e7ef');
const kamera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 200);
kamera.position.set(30, 24, 34);
const kontrol = new OrbitControls(kamera, renderer.domElement);
kontrol.target.set(12.5, 0.5, 8);
// sabit kamera: elle çevrilmez; ofis ekrana tam sığacak şekilde otomatik yerleşir
kontrol.enableRotate = false; kontrol.enablePan = true; kontrol.enableZoom = true; kontrol.screenSpacePanning = true;
// döndürme yok: tek parmak/sol tık kaydırır, iki parmak/teker yakınlaştırır; çift dokununca ilk görünüme döner
kontrol.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
kontrol.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_PAN };
let ilkUzaklik = 30;
kontrol.addEventListener('change', () => {   // ofisin dışına kaçmasın
  const t = kontrol.target, ox = THREE.MathUtils.clamp(t.x, 0, 26) - t.x, oz = THREE.MathUtils.clamp(t.z, 0, 16) - t.z;
  if (ox || oz) { t.x += ox; t.z += oz; kamera.position.x += ox; kamera.position.z += oz; }
});
renderer.domElement.addEventListener('dblclick', () => cerceve());
let sonDokunma = 0; renderer.domElement.addEventListener('touchend', e => { const n = Date.now(); if (n - sonDokunma < 300 && e.touches.length === 0) cerceve(); sonDokunma = n; });
const KOSE = []; for (const x of [0, 26]) for (const y of [0, 2.4]) for (const z of [0.3, 16]) KOSE.push(new THREE.Vector3(x, y, z));
function cerceve() {
  if (innerWidth < 4 || innerHeight < 4) return;   // gizli/boyutsuz çerçevede hesaplama yapma (NaN kamerayı bozuyordu)
  const dik = innerWidth / innerHeight < 0.85;
  const yon = (dik ? new THREE.Vector3(1, 1.3, 0.12) : new THREE.Vector3(0.55, 1.0, 1.0)).normalize();
  kamera.fov = dik ? 34 : 30; kamera.aspect = innerWidth / innerHeight; kamera.updateProjectionMatrix();
  const hedef = new THREE.Vector3(13, 0.6, 8), p = new THREE.Vector3();
  const sig = (d) => { kamera.position.copy(hedef).addScaledVector(yon, d); kamera.lookAt(hedef); kamera.updateMatrixWorld();
    let x0 = 9, x1 = -9, y0 = 9, y1 = -9; for (const k of KOSE) { p.copy(k).project(kamera); x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
    return [x0, x1, y0, y1]; };
  for (let tur = 0; tur < 4; tur++) {
    let a = 5, b = 120; for (let i = 0; i < 30; i++) { const m = (a + b) / 2, [x0, x1, y0, y1] = sig(m); (Math.max(-x0, x1, -y0, y1) > 0.97 ? a = m : b = m); }
    const [x0, x1, y0, y1] = sig(b); const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    // görüntüyü ortala: hedefi ekran sağ/yukarı yönünde kaydır
    const sag = new THREE.Vector3().setFromMatrixColumn(kamera.matrixWorld, 0), ust = new THREE.Vector3().setFromMatrixColumn(kamera.matrixWorld, 1);
    const yar = Math.tan(THREE.MathUtils.degToRad(kamera.fov / 2)) * b;
    hedef.addScaledVector(sag, cx * yar * kamera.aspect).addScaledVector(ust, cy * yar);
  }
  kontrol.target.copy(hedef); kontrol.update();
  ilkUzaklik = kamera.position.distanceTo(hedef);
  if (isFinite(ilkUzaklik) && ilkUzaklik > 0) { kontrol.minDistance = ilkUzaklik * 0.18; kontrol.maxDistance = ilkUzaklik * 1.15; }
}
cerceve();
const gok = new THREE.HemisphereLight('#fff8ee', '#a8927a', 1.45); sahne.add(gok);
const gunes = new THREE.DirectionalLight('#fff1dc', 2.5);
gunes.position.set(20, 26, 22); gunes.castShadow = true; gunes.shadow.mapSize.setScalar(GOM ? 1024 : 2048);
Object.assign(gunes.shadow.camera, { left: -20, right: 20, top: 16, bottom: -16, near: 1, far: 70 });
gunes.shadow.bias = -0.0008; gunes.shadow.normalBias = 0.03; gunes.target.position.set(13, 0, 8); sahne.add(gunes, gunes.target);

const MAT = {};
const mat = (renk, pruz = 0.72, ek = {}) => { const k = renk + pruz + JSON.stringify(ek); return MAT[k] || (MAT[k] = new THREE.MeshStandardMaterial(Object.assign({ color: renk, roughness: pruz, metalness: 0 }, ek))); };
function parca(geo, renk, x = 0, y = 0, z = 0, ebeveyn, golge = true) {
  const m = new THREE.Mesh(geo, typeof renk === 'string' ? mat(renk) : renk);
  m.position.set(x, y, z); m.castShadow = golge; m.receiveShadow = true; (ebeveyn || sahne).add(m); return m;
}
const kutu = (w, h, d) => new THREE.BoxGeometry(w, h, d);
const silindir = (r1, r2, h, s = 20) => new THREE.CylinderGeometry(r1, r2, h, s);
function yuvarlakKutu(w, h, d, r = 0.05) {
  const s = new THREE.Shape(); const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r); s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h); s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(s, { depth: Math.max(0.001, d - 2 * r), bevelEnabled: true, bevelThickness: r, bevelSize: r * 0.6, bevelSegments: 2, curveSegments: 4 });
  g.translate(0, 0, -(d - 2 * r) / 2); return g;
}
function tuval(w, h, ciz) { const c = document.createElement('canvas'); c.width = w; c.height = h; ciz(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
function tekrarli(t, x, y) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); return t; }
function yazili(metin, { w = 512, h = 128, zemin = '#ffffff', renk = '#1b1b1b', font = '700 64px system-ui' } = {}) {
  return tuval(w, h, (c) => { c.fillStyle = zemin; c.fillRect(0, 0, w, h); c.fillStyle = renk; c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(metin, w / 2, h / 2 + 4); });
}
function levha(t, w, h, x, y, z, ry = 0, ebeveyn) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: t, roughness: 0.5 })); m.position.set(x, y, z); m.rotation.y = ry; (ebeveyn || sahne).add(m); return m; }

/* ================= bina ================= */
const W = 26, D = 16;
const parke = tekrarli(tuval(512, 512, (c) => { for (let i = 0; i < 8; i++) for (let j = 0; j < 3; j++) {
  const k = 150 + Math.random() * 30 | 0; c.fillStyle = `rgb(${k + 42},${k + 2},${k - 48})`; const y = i * 64, x = j * 256 + (i % 2) * 128 - 128;
  c.fillRect(x, y, 256, 64); c.strokeStyle = 'rgba(70,40,20,.35)'; c.lineWidth = 2; c.strokeRect(x, y, 256, 64);
  for (let n = 0; n < 6; n++) { c.strokeStyle = `rgba(90,55,25,${.06 + Math.random() * .1})`; c.beginPath(); const yy = y + 8 + Math.random() * 48; c.moveTo(x, yy); c.bezierCurveTo(x + 80, yy + 4, x + 170, yy - 4, x + 256, yy + 2); c.stroke(); } } }), 7, 4);
const fayans = tekrarli(tuval(256, 256, (c, w, h) => { c.fillStyle = '#eeeae3'; c.fillRect(0, 0, w, h); c.fillStyle = '#e2ddd3'; c.fillRect(0, 0, 128, 128); c.fillRect(128, 128, 128, 128);
  c.strokeStyle = '#c9c2b5'; c.lineWidth = 3; for (let i = 0; i <= 2; i++) { c.beginPath(); c.moveTo(i * 128, 0); c.lineTo(i * 128, h); c.stroke(); c.beginPath(); c.moveTo(0, i * 128); c.lineTo(w, i * 128); c.stroke(); } }), 4.5, 3);
const hali = tekrarli(tuval(128, 128, (c, w, h) => { c.fillStyle = '#5d6b70'; c.fillRect(0, 0, w, h); for (let i = 0; i < 400; i++) { c.fillStyle = `rgba(255,255,255,${Math.random() * .06})`; c.fillRect(Math.random() * w, Math.random() * h, 2, 2); } }), 6, 4);
parca(kutu(17, 0.2, D), new THREE.MeshStandardMaterial({ map: parke, roughness: 0.55 }), 8.5, -0.1, D / 2);
parca(kutu(9, 0.2, 6.5), new THREE.MeshStandardMaterial({ map: fayans, roughness: 0.35 }), 21.5, -0.1, 3.25);
parca(kutu(9, 0.2, D - 6.5), new THREE.MeshStandardMaterial({ map: tekrarli(parke.clone(), 4, 4), roughness: 0.55 }), 21.5, -0.1, 6.5 + (D - 6.5) / 2);
parca(kutu(6.2, 0.02, 4.6), new THREE.MeshStandardMaterial({ map: hali, roughness: 0.95 }), 9.75, 0.011, 2.5, null, false);
const DUVAR = '#f4eee6';
parca(kutu(W, 3.2, 0.2), DUVAR, W / 2, 1.6, -0.1);            // arka
parca(kutu(0.2, 3.2, D), DUVAR, -0.1, 1.6, D / 2);            // sol
parca(kutu(0.2, 3.2, 11.2), DUVAR, W + 0.1, 1.6, 5.6);        // sağ (kapıya kadar)
parca(kutu(0.2, 3.2, 1.2), DUVAR, W + 0.1, 1.6, 15.4);
parca(kutu(0.2, 0.8, 3.6), DUVAR, W + 0.1, 2.8, 13.0);
parca(kutu(W, 0.12, 0.22), '#bfa98a', W / 2, 0.06, 0.01); parca(kutu(0.22, 0.12, D), '#bfa98a', 0.01, 0.06, D / 2);
// cam bölmeler: müdür odası (x 0-6, z 0-5) ve toplantı odası (x 6.3-13, z 0-5)
const CAM = new THREE.MeshStandardMaterial({ color: '#cfe6ec', roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.22, depthWrite: false });
const CERCEVE = '#3d4a4f';
function camDuvar(x1, z1, x2, z2, kapiOrta, kapiGen = 1.0) {
  const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz), ry = Math.atan2(dx, dz) - Math.PI / 2;
  const parcalar = kapiOrta == null ? [[0, L]] : [[0, kapiOrta - kapiGen / 2], [kapiOrta + kapiGen / 2, L]];
  parcalar.forEach(([a, b]) => { const m = (a + b) / 2, uz = b - a; if (uz <= 0.01) return;
    const p = new THREE.Mesh(kutu(uz, 2.6, 0.03), CAM); p.position.set(x1 + dx * m / L, 1.3, z1 + dz * m / L); p.rotation.y = ry; sahne.add(p);
    [a, b].forEach(t => parca(kutu(0.06, 2.7, 0.06), CERCEVE, x1 + dx * t / L, 1.35, z1 + dz * t / L)); });
  const ust = parca(kutu(L, 0.06, 0.07), CERCEVE, x1 + dx / 2, 2.67, z1 + dz / 2); ust.rotation.y = ry;
}
camDuvar(0, 5, 6.2, 5, 4.6); camDuvar(6.2, 0, 6.2, 5); camDuvar(6.2, 5, 13, 5, 3.3, 1.2); camDuvar(13, 0, 13, 5);
levha(yazili('MÜDÜR', { w: 256, h: 64, zemin: '#0f6e6a', renk: '#fff', font: '700 34px system-ui' }), 0.8, 0.2, 2.2, 2.35, 5.03);
levha(yazili('TOPLANTI', { w: 256, h: 64, zemin: '#0f6e6a', renk: '#fff', font: '700 34px system-ui' }), 0.8, 0.2, 8.0, 2.35, 5.03);
// mutfak bölmesi (x=16.6, z 0-6.5) ve kapı boşluğu
parca(kutu(0.16, 3.2, 3.2), '#e9f2f1', 16.6, 1.6, 1.6); parca(kutu(0.16, 3.2, 1.6), '#e9f2f1', 16.6, 1.6, 5.7);
parca(kutu(0.16, 0.8, 1.7), '#e9f2f1', 16.6, 2.8, 4.05);
parca(kutu(5.2, 3.2, 0.16), '#e9f2f1', 21.0 - 1.8, 1.6, 6.5); parca(kutu(1.6, 3.2, 0.16), '#e9f2f1', 25.2, 1.6, 6.5);
parca(kutu(1.6, 0.8, 0.16), '#e9f2f1', 23.6, 2.8, 6.5);
levha(yazili('MUTFAK', { w: 256, h: 64, zemin: '#e07a4f', renk: '#fff', font: '700 34px system-ui' }), 0.8, 0.2, 16.69, 2.5, 4.05, Math.PI / 2);
// mutfak kapısı (bölmenin ortası, z 3.2-4.9) - menteşeli
const kapiM = new THREE.Group(); kapiM.position.set(16.6, 0, 3.22); sahne.add(kapiM);
parca(kutu(0.05, 2.3, 1.66), '#b77b45', 0, 1.15, 0.83, kapiM); parca(new THREE.SphereGeometry(0.045, 12, 8), '#e8c547', 0.06, 1.05, 1.5, kapiM); parca(new THREE.SphereGeometry(0.045, 12, 8), '#e8c547', -0.06, 1.05, 1.5, kapiM);
let kapiAci = 0;
// giriş: sağ duvarda çift cam kapı (z 11.2-14.8)
const girisSol = new THREE.Group(); girisSol.position.set(W + 0.1, 0, 11.2); sahne.add(girisSol);
const girisSag = new THREE.Group(); girisSag.position.set(W + 0.1, 0, 14.8); sahne.add(girisSag);
[[girisSol, 1], [girisSag, -1]].forEach(([g, y]) => { const c = new THREE.Mesh(kutu(0.05, 2.35, 1.78), CAM); c.position.set(0, 1.18, 0.9 * y); g.add(c);
  parca(kutu(0.07, 2.4, 0.06), CERCEVE, 0, 1.2, 1.78 * y, g); parca(kutu(0.07, 0.06, 1.8), CERCEVE, 0, 2.37, 0.9 * y, g); parca(kutu(0.05, 0.5, 0.04), '#c9cfd2', -0.06, 1.1, 1.6 * y, g); });
let girisAci = 0;
levha(yazili('ZORE ANTALYA', { w: 512, h: 96, zemin: '#141414', renk: '#ffffff', font: '800 54px system-ui' }), 2.2, 0.42, W - 0.02, 2.85, 13.0, -Math.PI / 2);
parca(kutu(1.6, 0.02, 2.6), '#3b3b3b', W - 1.0, 0.012, 13.0, null, false);   // paspas

// pencereler (arka duvar) — dışarıda deniz ve Toroslar
const manzara = tuval(1024, 512, (c, w, h) => {
  const g = c.createLinearGradient(0, 0, 0, h * 0.62); g.addColorStop(0, '#7fc3ea'); g.addColorStop(1, '#cfe9f6'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.fillStyle = '#ffe58a'; c.beginPath(); c.arc(w * 0.8, h * 0.2, 34, 0, 7); c.fill();
  [[0.05, 0.62, 0.35, 0.33, '#8fb0c0'], [0.32, 0.62, 0.62, 0.38, '#a5c2cf'], [0.55, 0.62, 0.98, 0.3, '#8aa9b9']].forEach(([a, y, b, t, col]) => { c.fillStyle = col; c.beginPath(); c.moveTo(w * a, h * y); c.lineTo(w * (a + b) / 2, h * t); c.lineTo(w * b, h * y); c.fill(); });
  const s = c.createLinearGradient(0, h * 0.62, 0, h); s.addColorStop(0, '#2a8fc5'); s.addColorStop(1, '#1d6f9f'); c.fillStyle = s; c.fillRect(0, h * 0.62, w, h);
  c.fillStyle = 'rgba(255,255,255,.35)'; for (let i = 0; i < 40; i++) c.fillRect(Math.random() * w, h * 0.65 + Math.random() * h * 0.33, 14 + Math.random() * 20, 2);
});
function pencere(x, gen = 2.2) {
  parca(kutu(gen + 0.16, 1.7, 0.1), '#ffffff', x, 1.75, 0.02);
  const c = new THREE.Mesh(new THREE.PlaneGeometry(gen, 1.5), new THREE.MeshBasicMaterial({ map: manzara })); c.position.set(x, 1.75, 0.08); sahne.add(c);
  parca(kutu(0.05, 1.5, 0.05), '#ffffff', x, 1.75, 0.1); parca(kutu(gen + 0.3, 0.07, 0.22), '#ffffff', x, 0.9, 0.13);
}
pencere(3.0); pencere(9.7, 3.0); pencere(19.0); pencere(23.5);

/* ================= mobilya ================= */
const EKRANLAR = [];
function masa(x, z, yon = 0, renk = '#efe3cf') {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = yon; sahne.add(g);
  parca(yuvarlakKutu(1.6, 0.06, 0.8, 0.025), renk, 0, 0.75, 0, g);
  [[-0.74, -0.33], [0.74, -0.33], [-0.74, 0.33], [0.74, 0.33]].forEach(([a, b]) => parca(kutu(0.05, 0.73, 0.05), '#4e5b60', a, 0.365, b, g));
  parca(kutu(1.4, 0.35, 0.02), '#d8cdb8', 0, 0.5, 0.36, g);
  parca(yuvarlakKutu(0.62, 0.38, 0.035, 0.015), '#22272a', 0, 1.12, 0.22, g);
  const e = new THREE.Mesh(new THREE.PlaneGeometry(0.57, 0.33), new THREE.MeshBasicMaterial({ color: '#6ec8d6' })); e.position.set(0, 1.12, 0.2); e.rotation.y = Math.PI; g.add(e); EKRANLAR.push(e);
  parca(kutu(0.04, 0.2, 0.04), '#22272a', 0, 0.87, 0.24, g); parca(kutu(0.2, 0.015, 0.14), '#22272a', 0, 0.785, 0.24, g);
  parca(yuvarlakKutu(0.44, 0.02, 0.14, 0.008), '#e9edf0', 0, 0.79, -0.08, g);
  parca(new THREE.SphereGeometry(0.03, 10, 8), '#e9edf0', 0.32, 0.795, -0.08, g).scale.set(1, 0.5, 1.4);
  return g;
}
function sandalye(x, z, yon = 0, renk = '#2c3e45') {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = yon; sahne.add(g);
  parca(yuvarlakKutu(0.48, 0.07, 0.46, 0.03), renk, 0, 0.46, 0, g); parca(yuvarlakKutu(0.46, 0.5, 0.06, 0.03), renk, 0, 0.78, -0.22, g);
  parca(silindir(0.025, 0.025, 0.4, 10), '#4a4f52', 0, 0.23, 0, g); parca(silindir(0.24, 0.24, 0.03, 16), '#4a4f52', 0, 0.03, 0, g);

// Yüzlerce küçük parça tek tek çizilince telefonda kare atlıyor; aynı malzemeli sabit parçaları tek parçada topluyoruz.
function statikBirlestir() {
  const haric = new Set();
  [kapiM, girisSol, girisSag, yelkovan, akrep, storyEkran, ...buhar, ...EKRANLAR, ...STANDLAR.map(x => x.yeni)].forEach(o => o.traverse(n => haric.add(n)));
  sahne.updateMatrixWorld(true);
  const gruplar = new Map(), sil = [], sk = new THREE.Vector3();
  sahne.traverse(m => {
    if (!m.isMesh || haric.has(m) || Array.isArray(m.material) || m.material.transparent) return;
    if (!m.geometry.boundingSphere) m.geometry.computeBoundingSphere();
    m.matrixWorld.decompose(new THREE.Vector3(), new THREE.Quaternion(), sk);
    const golge = m.castShadow && m.geometry.boundingSphere.radius * Math.max(sk.x, sk.y, sk.z) > 0.18;   // küçük ürünler gölge atmasın
    const anahtar = m.material.uuid + (golge ? '|g' : '');
    let g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
    for (const ad of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(ad)) g.deleteAttribute(ad);
    if (!g.attributes.uv) g.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count * 2), 2));
    g.applyMatrix4(m.matrixWorld);
    if (!gruplar.has(anahtar)) gruplar.set(anahtar, { mat: m.material, golge, l: [] });
    gruplar.get(anahtar).l.push(g); sil.push(m);
  });
  sil.forEach(m => m.parent.remove(m));
  gruplar.forEach(({ mat, golge, l }) => { const b = new THREE.Mesh(mergeGeometries(l), mat); b.castShadow = golge; b.receiveShadow = true; sahne.add(b); });
  return [sil.length, gruplar.size];
}

        { tur: 'otur', yer: [bos[0], bos[1]], yon: bos[2], sure: 70, not: bos[3] ? 'Kanepede dinleniyor' : 'Öğle yemeği 🍽️', anim: k.cins + (bos[3] ? '_sit_table_idle_look_around' : '_sit_table_idle_neutral_01'), ust: bos[3] ? null : 'drink_drinking', bardak: !bos[3] },
        { tur: 'bitti', f: () => { yemekDolu.delete(id); } }]); }
  }
  if (evre === 'mesai' && Math.random() < 0.28) return gorev(k, [...molaGorevi(k), ...masaGorevi(k)]);
  return gorev(k, masaGorevi(k));
}
